# ===================================================================
# ARNAVEE HOSPITALITY — LMS BACKEND CONFIGURATION
# ===================================================================

spring.application.name=lms-backend
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (PostgreSQL / Railway / Local)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arnavee_lms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# 256-bit Base64 Secret Key for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 24 hours (86400000 ms), Refresh: 7 days (604800000 ms)
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -------------------------------------------------------------------
# Email Configuration (JavaMailSender / Gmail SMTP)
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:titurkarbhushan2001@gmail.com}
spring.mail.password=${MAIL_PASSWORD:app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.admin-recipient=${ADMIN_EMAIL:titurkarbhushan2001@gmail.com}

# -------------------------------------------------------------------
# Cloudinary Configuration
# -------------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:arnavee-hospitality}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://aranavee-frontend.vercel.app}
